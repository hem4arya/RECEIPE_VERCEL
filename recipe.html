<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Recipe Details</title>
    <link rel="stylesheet" href="Css/receipeDetail.css" />
  </head>
  <body>
    <button id="backButton">← Back to Recipes</button>

    <div class="recipe-hero">
      <img id="recipeImage" src="" alt="Recipe Image" />
      <div class="hero-content">
        <h1 id="recipeName"></h1>
      </div>
    </div>

    <div id="recipeContainer">
      <div class="recipe-meta-grid">
        <div class="meta-item">
          <span class="meta-label">Difficulty</span>
          <span class="meta-value" id="recipeDifficulty"></span>
        </div>
        <div class="meta-item">
          <span class="meta-label">Prep Time</span>
          <span class="meta-value"><span id="prepTime"></span> min</span>
        </div>
        <div class="meta-item">
          <span class="meta-label">Cook Time</span>
          <span class="meta-value"><span id="cookTime"></span> min</span>
        </div>
        <div class="meta-item">
          <span class="meta-label">Servings</span>
          <span class="meta-value" id="servings"></span>
        </div>
        <div class="meta-item">
          <span class="meta-label">Calories</span>
          <span class="meta-value" id="calories"></span>
        </div>
      </div>

      <div class="recipe-details-grid">
        <div class="ingredients-section">
          <h2>Ingredients</h2>
          <ul id="ingredientsList"></ul>
        </div>
        <div class="instructions-section">
          <h2>Instructions</h2>
          <ol id="instructionsList"></ol>
        </div>
      </div>
    </div>
    <script src="Script/recipeDetail.js" type="module"></script>
  </body>
</html>
